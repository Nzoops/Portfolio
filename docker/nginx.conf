server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects on the port you opened (8081), and never cache while previewing.
    absolute_redirect off;
    expires -1;

    # Same address as GitHub Pages: https://nzoops.github.io/Portfolio/
    location = / { return 302 /Portfolio/; }

    # Like GitHub Pages (Jekyll): files and folders starting with _ or . are not
    # published, so vc/_src/ and .git/ stay private here too.
    location ~ /[._] { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
