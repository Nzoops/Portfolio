# Local preview of the portfolio at the same address shape as GitHub Pages.
#
#   docker compose up -d            then open http://localhost:8081/Portfolio/
#   docker compose run --rm build   regenerate the VC pages (vc/_src/build.py)
#   docker compose down             stop

services:
  site:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/usr/share/nginx/html/Portfolio:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  build:
    image: python:3.12-slim
    profiles: ["tools"]
    # Files it writes belong to you, not root.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /site
    volumes:
      - ./:/site
    # build.py only reads and writes local files, so it gets no network.
    network_mode: none
    command: ["python3", "vc/_src/build.py"]
